name: CI

# The repo's own gates, run on every PR. brain.db is gitignored, so CI has no
# brain to run `brain verify` against: it runs the checks that need none —
# the zero-dependency gate, the test suite, the skills/plugin check and a
# fresh-init smoke (init in a temp repo, then check).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: tests + check-skills + init smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # node:sqlite with FTS5 needs Node 24; pinned to an exact release (bump
      # it deliberately) so a red run is attributable to the diff, not to a
      # moving runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      # Zero dependencies by design — nothing to install. Count declared KEYS:
      # an empty `"devDependencies": {}` left behind by an install/uninstall
      # round-trip is not a dependency.
      - name: Confirm zero-dependency invariant
        run: |
          node -e "
            const p = require('./package.json');
            const declared = ['dependencies','devDependencies','peerDependencies','optionalDependencies']
              .flatMap((k) => Object.keys(p[k] || {}));
            if (declared.length) { console.error('declared: ' + declared.join(', ')); process.exit(1); }
            console.log('zero-dep invariant holds');
          "

      - name: Tests (lib/brain + CLI)
        run: node --test

      - name: Skills tree + plugin files
        run: node scripts/check-skills.mjs

      - name: Fresh-init smoke
        run: |
          set -euo pipefail
          BIN="$PWD/bin/brain.js"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          git init -q -b main
          node "$BIN" init
          node "$BIN" check
          node "$BIN" context
          node "$BIN" --help
